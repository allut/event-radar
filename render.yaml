services:
  - type: web
    name: event-radar-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_SHIP_URL
        sync: false
      - key: LOG_SHIP_TOKEN
        sync: false

  - type: cron
    name: event-radar-keepalive
    runtime: python
    plan: free
    schedule: "*/15 * * * *"
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import httpx, os; httpx.get(os.environ['API_URL'] + '/internal/tick', timeout=10)"
    envVars:
      - key: API_URL
        sync: false

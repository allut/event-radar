# Cloudflare Pages build config, checked in as the source of truth for the
# platform (mirrors how ../render.yaml is checked in for the backend).
#
# Static SPA build (issue #343) plus, as of issue #344, the two Pages
# Functions under functions/api/ (seo-audit, prerender-cadence) — Cloudflare
# auto-routes anything under functions/ by convention, with no opt-in step.
# As of issue #346, the build-time Playwright prerender pass
# (scripts/prerender.ts) also runs here — the `npm run build` script's gate
# checks `$CF_PAGES`, and runs `playwright install chromium` first, since
# Cloudflare's build container runs Playwright's own bundled Chromium
# directly (the #340 spike confirmed `chromium.launch()` succeeds in this
# container).
#
# CF_PAGES_BRANCH and CF_PAGES_COMMIT_SHA (both auto-injected by Cloudflare
# Pages) drive the prerender-chain machinery
# (prerender.ts's isPreviewBuild/commitRoundMarker, resolveRoundStart's
# commit-message read) — Cloudflare exposes neither a dedicated
# preview/production flag nor a commit-message env var, so isPreviewBuild
# infers preview from CF_PAGES_BRANCH against the production branch, and the
# commit message is looked up via the GitHub API against CF_PAGES_COMMIT_SHA
# instead.
#
# `nodejs_compat` is required: seoAuditAuth.ts's `isValidAuditToken` (used by
# both Pages Functions) imports `timingSafeEqual` from `node:crypto`, which
# the Workers runtime only exposes with this flag set — without it, every
# request to either function throws at import time. vitest doesn't catch
# this because tests run under real Node, not the Workers runtime.
#
# No [build] section: unlike Workers, Pages projects reject a "build" table
# in wrangler.toml outright ("Configuration file for Pages projects does not
# support \"build\"") — Wrangler fails config validation before the clone
# even runs a build. The build command (`npm run build`) and root directory
# live in the Cloudflare Pages dashboard's per-project build configuration
# instead; only `pages_build_output_dir` and `[vars]` are read from this file
# for a Pages project.
name = "event-radar"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[vars]
CLOUDFLARE_ACCOUNT_ID = "d2ff5532ee1b0e671d2fb3c9570dbb77"
R2_BUCKET_NAME = "event-radar-prerender-chain-state"
NODE_VERSION = "24"
# Non-secret build-time flags. Anything credential-shaped (deploy hook URLs,
# API tokens) must NOT go here — this file is checked into git. Those stay
# as encrypted Secrets via the Cloudflare Pages dashboard or
# `wrangler pages secret put`, which remains available even once [vars] is
# managed from this file (see the dashboard's own "Only Secrets... can be
# managed via the Dashboard" notice once [vars] is present).
VITE_GOOGLE_SIGNIN_CONSUMER_ENABLED = "true"
VITE_GOOGLE_SIGNIN_ORGANIZER_ENABLED = "true"
PRERENDER_RENDER_BUDGET_MINUTES = "10"

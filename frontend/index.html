<!doctype html>
<!-- lang="et" matches the bare-path Estonian default (issue #47); useSeoMeta
     (via react-helmet-async) overrides this per-route at runtime once JS mounts. -->
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◉</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- No static description here: useSeoMeta (react-helmet-async) sets one
         per route for Landing/EventDetail; react-helmet-async only manages
         tags it renders, so a static one here would linger as a duplicate
         <meta name="description"> alongside Helmet's on every indexable page. -->
    <title>What's on Radar</title>
    <!-- Fonts are self-hosted via @fontsource (imported in src/main.tsx), not loaded
         from Google Fonts — keeps the CSP free of third-party font/style hosts. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

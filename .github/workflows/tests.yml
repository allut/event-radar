name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: eventradar
          POSTGRES_PASSWORD: eventradar
          POSTGRES_DB: eventradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://eventradar:eventradar@localhost:5432/eventradar
      # alembic/env.py imports app.config, whose module-level `settings = Settings()`
      # requires SECRET_KEY (no default; validators reject a "change-me-" prefix and
      # anything under 32 chars). backend/.env is gitignored, so CI must supply it —
      # the same dummy-value trick tests/conftest.py uses for pytest. Not a secret.
      SECRET_KEY: ci-migrations-only-not-a-real-secret-value
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Round-trips the full chain both ways (the 0030/admin_actions incident
      # was exactly a migration nobody applied) and catches a model changed
      # without a matching migration (autogenerate diff against Base.metadata).
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check

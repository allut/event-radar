name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing

  frontend-tests:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  migrations:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: eventradar
          POSTGRES_PASSWORD: eventradar
          POSTGRES_DB: eventradar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventradar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://eventradar:eventradar@localhost:5432/eventradar
      # alembic/env.py imports app.config, whose module-level `settings = Settings()`
      # requires SECRET_KEY (no default; validators reject a "change-me-" prefix and
      # anything under 32 chars). backend/.env is gitignored, so CI must supply it —
      # the same dummy-value trick tests/conftest.py uses for pytest. Not a secret.
      SECRET_KEY: ci-migrations-only-not-a-real-secret-value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Round-trips the full chain both ways (the 0030/admin_actions incident
      # was exactly a migration nobody applied) and catches a model changed
      # without a matching migration (autogenerate diff against Base.metadata).
      - run: alembic upgrade head
      - run: alembic downgrade base
      - run: alembic upgrade head
      - run: alembic check

# Overlay on the repo-root docker-compose.yml. The root file stays the single
# source of truth for `db` (image, credentials, volume, healthcheck, port).
services:
  app:
    build:
      # Paths here resolve against the COMPOSE PROJECT DIRECTORY (the repo root,
      # taken from the first -f file), not against this file's own directory.
      # `..` would therefore point one level above the repo.
      context: .
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    volumes:
      - .:/workspaces/event-radar:cached
      # node_modules in a named volume: the host copy is a Windows install
      # (win32 esbuild/rollup binaries) and would break Vite under Linux.
      - eventradar-node-modules:/workspaces/event-radar/frontend/node_modules
      # Claude Code config/credentials in a named volume: survives rebuild,
      # and stays isolated from the host's Windows ~/.claude. sync-claude-config.sh
      # mirrors the host config in one way (its rtk hook resolves against the
      # binary the Dockerfile installs).
      - claude-code-config:/home/vscode/.claude
      # anvil's config.json + anvil.db ledger. Named volume, not a host bind:
      # the host copy carries a plugin-root junction to a Windows path and a
      # SQLite DB that anvil must write, and sharing SQLite across a Docker
      # Desktop bind mount invites locking failures.
      - claude-anvil-state:/home/vscode/.claude-anvil
      # npm/npx cache. Without it `npx -y ccstatusline@latest` re-fetches the
      # package after every rebuild, stalling the first status line render.
      - claude-npm-cache:/home/vscode/.npm
    env_file:
      # Optional -- holds ANVIL_GEMINI_API_KEY / ANVIL_OPENAI_API_KEY, which the
      # container cannot recover from the host's DPAPI-encrypted config.json.
      # `required: false` needs Compose v2.24+; without it, `docker compose up`
      # fails when the file is absent.
      - path: .devcontainer/anvil.env
        required: false
    environment:
      # OS env outranks backend/.env in pydantic-settings, so this wins over the
      # host's localhost DSN without editing that (gitignored) file. Declared in
      # compose rather than devcontainer.json because containerEnv is not
      # supported for compose-based dev containers, and remoteEnv would not
      # reach `docker compose exec` shells.
      DATABASE_URL: postgresql+asyncpg://eventradar:eventradar@db:5432/eventradar
      APP_ENV: development
      # Kill switch for the embedded APScheduler. Off by default here: the
      # schedule scrapes live third-party sites hourly, spends real LLM budget,
      # and can send real digest email on a timer — unacceptable for a scratch
      # environment left running under `uvicorn --reload`. Every job still has a
      # manual POST /admin/* trigger. To run the real cadence for one session:
      #   ENABLE_SCHEDULER=true uvicorn app.main:app --reload
      ENABLE_SCHEDULER: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # ~/.claude.json (OAuth account, per-project trust) lives outside ~/.claude,
      # so the volume mount alone would not keep `claude` signed in across rebuilds.
      CLAUDE_CONFIG_DIR: /home/vscode/.claude
      # The CLI is installed globally by root (devcontainer feature + post-start
      # npm refresh). Left enabled, the built-in updater cannot write there and
      # migrates itself to ~/.local/bin, which shadows /usr/local/bin and is not
      # on a volume -- so the version would silently diverge from what we install.
      DISABLE_AUTOUPDATER: "1"
    depends_on:
      db:
        condition: service_healthy

volumes:
  eventradar-node-modules:
  claude-code-config:
  claude-anvil-state:
  claude-npm-cache:
